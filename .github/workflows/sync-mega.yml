name: Sync Mega Eletrônicos

# Coleta diária de produtos/preços da Mega Eletrônicos para a tabela produtos.
# Roda no GitHub Actions (não na Vercel).

on:
  workflow_dispatch:        # permite rodar manualmente pelo botão "Run workflow"
  schedule:
    - cron: "0 15 * * *"    # 15:00 UTC = 12:00 BRT (coleta diária)

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Coletar e atualizar produtos
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/sync-mega.mjs
