<!-- =========================================================================
     ESTILO
     A página é propositalmente independente de assets/style.css: ela tem um
     layout próprio, de tela única, e não deve herdar nada do resto do site.
     ========================================================================= -->
<style>
  *, *::before, *::after { box-sizing: border-box; }

  html, body { height: 100%; }

  body {
    margin: 0;
    display: flex;
    flex-direction: column;
    min-height: 100dvh;
    font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
    color: #fff;
    background: #0d0904;
    background-image: radial-gradient(125% 95% at 50% 16%,
                      #2a1a08 0%, #140d05 58%, #0d0904 100%);
    background-attachment: fixed;
    -webkit-font-smoothing: antialiased;
    text-align: center;
  }

  /* ---------------------------------------------------------------------
     1. Barra do topo
     O tamanho da frase acompanha a largura da tela para nunca quebrar em
     duas linhas: 13px no celular de 390px, um pouco menor nos mais estreitos.
     --------------------------------------------------------------------- */
  .topo {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    padding: calc(14px + env(safe-area-inset-top, 0px)) 12px 14px;
    background: #0e0a05;
    border-bottom: 1px solid #2b2114;
  }

  .topo-selo {
    flex: none;
    display: grid;
    place-items: center;
    width: 28px;
    height: 28px;
    border-radius: 8px;
    background: #25d366;
  }

  .topo-texto {
    font-size: clamp(10.5px, 3.33vw, 13px);
    font-weight: 800;
    letter-spacing: .2px;
    text-transform: uppercase;
    white-space: nowrap;
  }

  /* ---------------------------------------------------------------------
     2 a 5. Miolo
     --------------------------------------------------------------------- */
  /* O miolo começa logo abaixo da barra, não centralizado na vertical: a
     sobra de altura fica embaixo do botão, como no layout aprovado. */
  main {
    flex: 1 0 auto;
    display: flex;
    flex-direction: column;
    align-items: center;
    width: 100%;
    max-width: 420px;
    margin: 0 auto;
    padding: 50px 22px 24px;
  }

  .foto {
    width: 250px;
    height: 250px;
    flex: none;
    margin-bottom: 38px;
    border-radius: 50%;
    border: 5px solid #3a2c1a;
    object-fit: cover;
    /* A foto é vertical (~3:4) e o leque de aparelhos fica na metade de
       cima do quadro. Puxar o recorte para 33% centraliza os iPhones no
       círculo e corta o piso em cima e o pé embaixo. */
    object-position: 50% 33%;
    background: #1a1209;
    box-shadow: 0 14px 38px rgba(0, 0, 0, .55);
  }

  .titulo {
    margin: 0 0 40px;
    max-width: 340px;
    font-size: 24px;
    font-weight: 800;
    line-height: 1.28;
    color: #ffd21f;
  }

  .chamada {
    margin: 0 0 16px;
    font-size: 19px;
    font-weight: 700;
    color: #fff;
  }

  .botao {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 12px;
    width: 100%;
    padding: 18px 16px;
    border-radius: 999px;
    background: #25d366;
    color: #fff;
    /* 17px no celular de 390px; encolhe nos mais estreitos para o rótulo
       nunca quebrar em duas linhas. */
    font-size: clamp(13.5px, 4.36vw, 17px);
    font-weight: 800;
    letter-spacing: .2px;
    text-transform: uppercase;
    text-decoration: none;
    white-space: nowrap;
    animation: pulsa 1.6s ease-in-out infinite;
  }

  .botao svg { flex: none; }

  @keyframes pulsa {
    0% {
      transform: scale(1);
      box-shadow: 0 0 0 0 rgba(37, 211, 102, .55), 0 8px 26px rgba(37, 211, 102, .30);
    }
    50% {
      transform: scale(1.04);
      box-shadow: 0 0 0 20px rgba(37, 211, 102, 0), 0 10px 34px rgba(37, 211, 102, .45);
    }
    100% {
      transform: scale(1);
      box-shadow: 0 0 0 0 rgba(37, 211, 102, 0), 0 8px 26px rgba(37, 211, 102, .30);
    }
  }

  /* Linha discreta abaixo do botão: diz o que circula no grupo sem
     competir com a chamada nem com o botão. */
  .categorias {
    margin: 22px 0 0;
    max-width: 300px;
    color: #a89a84;
    font-size: 14px;
    font-weight: 400;
    line-height: 1.5;
    text-wrap: balance;
  }

  @media (prefers-reduced-motion: reduce) {
    .botao {
      animation: none;
      box-shadow: 0 8px 26px rgba(37, 211, 102, .30);
    }
  }

  /* ---------------------------------------------------------------------
     6. Rodapé
     --------------------------------------------------------------------- */
  .rodape {
    flex: none;
    padding: 16px 22px calc(18px + env(safe-area-inset-bottom, 0px));
    color: #7d7360;
    font-size: 13px;
    line-height: 1.6;
  }

  .rodape p { margin: 0; }

  /* Telas baixas (iPhone SE e afins): aperta tudo para caber sem rolar. */
  @media (max-height: 700px) {
    main { padding-top: 22px; }
    .foto { width: 186px; height: 186px; margin-bottom: 24px; }
    .titulo { font-size: 21px; margin-bottom: 24px; }
    .chamada { font-size: 17px; margin-bottom: 14px; }
    .categorias { margin-top: 16px; font-size: 13px; }
  }

  /* Telas muito baixas (iPhone SE antigo, 568px). */
  @media (max-height: 620px) {
    .foto { width: 144px; height: 144px; margin-bottom: 20px; }
    .titulo { font-size: 20px; margin-bottom: 20px; }
    .categorias { margin-top: 12px; }
  }
</style>
